{% extends "quotes/base.html" %}

{% block content %}
<section class="form-card">
    <div class="profile-heading">
        <img class="profile-avatar" src="{{ user.profile.avatar.url }}" alt="{{ user.username }}'s profile photo" />
        <p class="eyebrow">Your account</p>
        <h1>Profile settings</h1>
    </div>
    <form method="post" enctype="multipart/form-data" class="form">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label" for="{{ profile_form.avatar.id_for_label }}">Change profile photo</label>
            {{ profile_form.avatar }}
            {% for error in profile_form.avatar.errors %}<p class="field-errors mb-0">{{ error }}</p>{% endfor %}
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save changes</button>
            <a class="btn btn-outline-primary" href="{% url 'quotes:main' %}">Cancel</a>
        </div>
    </form>
</section>
{% endblock content %}
