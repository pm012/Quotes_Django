[tool.poetry]
name = "mgr-django"
version = "0.2.0"
description = "Modern Django application for quote management"
authors = ["Serhii Kroshka"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.14"
django = "^6.0"
django-environ = "^0.12.0"
psycopg = {extras = ["binary"], version = "^3.2.0"}
pillow = "^11.0.0"
mongoengine = "^0.29.0"
pymongo = "^4.10.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"